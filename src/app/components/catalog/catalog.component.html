<app-spinner *ngIf="spinner" />

<div class="gallery-container" infiniteScroll (scrolled)="onScrollDown()">
  <div class="masonry">
    <div class="masonry-item" *ngFor="let i of catalog; let j=index">
      <span class="span" >
        <p class="unlike" *ngIf="!likes.includes(i.id)" (click)="like(i.id)">{{i.likes}}</p>
        <p *ngIf="liked===i.id">{{i.likes+1}}</p>
        <p *ngIf="likes.includes(i.id) && liked!==i.id">{{i.likes}}</p>
        <p class="visits">{{i.visits}}</p>
      </span>
      <img src="../../../assets/img/{{i.id}}.jpg" alt="" (click)="onPreviewImage(j);visit(i.id)">
    </div>
  </div>
</div>

<div *ngIf="showMask" class="lightbox">
  <span *ngIf="showCount" class="count">{{currentIndex+1}}/{{totalImageCount}}</span>
  <button *ngIf="previewImage" class="close-btn" (click)="onClosePreview()">
    <i class="far fa-times"></i>
  </button>
  <button *ngIf="controls" class="btn-lightbox-carousel btn-prev" (click)="prev()">
    <i class="fas fa-arrow-circle-left icon-lightbox-carousel icon-prev"></i>
  </button>
  <button *ngIf="controls" class="btn-lightbox-carousel btn-next" (click)="next()">
    <i class="fas fa-arrow-circle-right icon-lightbox-carousel icon-next"></i>
  </button>
  <div *ngIf="previewImage"
    class="lightbox-img">
    <img src="../../../assets/img/{{currentLightboxImage}}.jpg" alt="">
  </div>
</div>
